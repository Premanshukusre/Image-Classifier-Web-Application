<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apple Disease Classifier</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f6;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 60px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .description {
            color: #666;
            margin-bottom: 30px;
        }

        .upload-box {
            border: 2px dashed #aaa;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        input[type="file"] {
            margin: 15px 0;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            background: #2e7d32;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1b5e20;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: #e8f5e9;
            border-radius: 10px;
        }

        .result h2 {
            margin-top: 0;
        }

        .confidence {
            font-size: 18px;
            font-weight: bold;
        }

        .error {
            margin-top: 20px;
            padding: 15px;
            background: #ffebee;
            color: #c62828;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🍎 Apple Disease Classifier</h1>

        <p class="description">
            Upload an image of an apple leaf to identify its disease.
        </p>

        <form method="POST" enctype="multipart/form-data">

            <div class="upload-box">

                <p>Select an apple leaf image:</p>

                <input type="file" name="image" accept="image/*" required>

                <br>

                <button type="submit">
                    Predict Disease
                </button>

            </div>

        </form>


        {% if prediction %}

        <div class="result">

            <h2>Prediction Result</h2>

            <p>
                <strong>Predicted Disease:</strong>
                {{ prediction }}
            </p>

            <p class="confidence">
                Confidence: {{ "%.2f"|format(confidence) }}%
            </p>

        </div>

        {% endif %}


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}

    </div>

</body>

</html>
